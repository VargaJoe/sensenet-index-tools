name: Local repository integration
on:
  workflow_dispatch:
jobs:
  repository-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Two repositories, native backup, report repair and isolated orphan acceptance
        run: python3 docker/local/multi_repository.py --no-browser --check
      - name: Keep credential-free acceptance summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: local-acceptance-summary
          path: .private/multi-repository-lab/acceptance-summary.json
