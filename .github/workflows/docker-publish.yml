name: Build and publish Docker image

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: vargajoe/sn-index-tools

jobs:
  publish:
    if: github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test image tag rules
        run: python3 -m unittest discover -s docker/tests -p 'test_*.py'

      - name: Determine image tags
        id: tags
        run: python3 docker/image_tags.py

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo '::error::Configure DOCKERHUB_USERNAME in repository Actions secrets.'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo '::error::Configure DOCKERHUB_TOKEN in repository Actions secrets.'; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish CLI and web image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.branch_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
          cache-from: type=gha,scope=index-tools
          cache-to: type=gha,mode=max,scope=index-tools

      - name: Record published image
        env:
          BRANCH_TAG: ${{ steps.tags.outputs.branch_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          SOURCE_SHA: ${{ steps.tags.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Image: $IMAGE_NAME:$BRANCH_TAG"
            echo "Version: $IMAGE_NAME:$VERSION_TAG"
            echo "Source commit: $SOURCE_SHA"
            echo "Digest: $IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
